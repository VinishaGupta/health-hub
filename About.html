<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ==========================================
                ADDRESS DETAILS
        =========================================== -->

        <div class="form-block">

            <h3>

                <i class="fa-solid fa-location-dot"></i>

                Medical Firm Address

            </h3>

            <div class="form-grid">

                <div class="input-group">

                    <label>

                        State <span class="required">*</span>

                    </label>
                    

                    <select name="state" required>

                        <option>

                            Select State

                        </option>

                    </select>

                </div>

                <div class="input-group" required>

                    <label>

                        District <span class="required">*</span>

                    </label>
                    

                    <select name="district">

                        <option>

                            Select District

                        </option>

                    </select>

                </div>

                <div class="input-group" required>

                    <label>

                        Taluka <span class="required">*</span>

                    </label>
                     

                    <select name="taluka">

                        <option>

                            Select Taluka

                        </option>

                    </select>

                </div>

                <div class="input-group" required>

                    <label>

                        Village / City <span class="required">*</span>

                    </label>
                    

                    <select name="village">

                        <option>

                            Select Village

                        </option>

                    </select>

                </div>

                <div class="input-group">

                    <label>

                        Pin Code <span class="required">*</span>

                    </label>

                    <input
                        type="text"
                        name="pin_code"
                        maxlength="6"
                        pattern="[0-9]{6}"
                        required>

                </div>

                <div class="input-group">

                    <label>

                        Plot No / Flat No

                    </label>

                    <input
                        type="text"
                        name="plot_number"
                        placeholder="Plot No. 42">

                </div>

                <div class="input-group">

                    <label>

                        Building / Apartment Name

                    </label>

                    <input
                        type="text"
                        name="building_name"
                        placeholder="Sunrise Heights">

                </div>

                <div class="input-group">

                    <label>

                        Colony

                    </label>

                    <input
                        type="text"
                        name="colony"
                        placeholder="Green Valley">

                </div>
                                <div class="input-group">

                    <label>

                        Area

                    </label>

                    <input
                        type="text"
                        name="area"
                        placeholder="Airport Road">

                </div>

                <div class="input-group">

                    <label>

                        Nearby Landmark

                    </label>

                    <input
                        type="text"
                        name="landmark"
                        placeholder="Nearby School">

                </div>

                <div class="input-group">

                    <label>

                        Behind

                    </label>

                    <input
                        type="text"
                        name="behind"
                        placeholder="Behind Bank">

                </div>

                <div class="input-group">

                    <label>

                        Google Map Link <span class="required">*</span>

                    </label>

                    <input
                        type="url"
                        name="google_map_link"
                        placeholder="https://maps.google.com/..."
                        required>

                </div>

            </div>

        </div>
    
</body>
</html>
