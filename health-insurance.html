<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Insurance Upload</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #f8f9ff;
        }
    </style>

    <link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
</head>

<body class="min-h-screen">

    <!-- Header -->
    <div class="bg-white shadow-md py-5 px-8">
        <h1 class="text-4xl font-bold text-blue-700">
            Health Insurance
        </h1>
    </div>

    <div class="max-w-4xl mx-auto py-12 px-6">

        <!-- Main Card -->
        <div class="bg-white rounded-3xl shadow-lg p-10">

            <!-- Icon -->
            <div class="flex justify-center mb-6">

                <div class="w-28 h-28 rounded-full bg-blue-100
                            flex items-center justify-center">

                    <span class="text-5xl">🛡️</span>

                </div>

            </div>





            <!-- Policy Details Form -->
            <div class="mt-10 bg-gray-50 border border-gray-200 rounded-3xl p-8">

                <h3 class="text-3xl font-bold text-blue-700 mb-6">
                    Insurance Policy Details
                </h3>

                <!-- Insurance Company -->
<!-- Insurance Company -->
<div class="mb-8">

    <label class="block text-gray-800 text-lg font-semibold mb-3">
        Name of Insurance Company
    </label>

    <div class="relative">

        <!-- Left Icon -->
        <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-blue-600">
            business
        </span>

        <select
            class="w-full h-14 pl-14 pr-12
                   rounded-xl
                   border border-blue-200
                   bg-blue-50/50
                   text-gray-800 text-lg
                   shadow-sm
                   appearance-none
                   transition-all duration-200
                   hover:border-blue-400
                   focus:bg-white
                   focus:border-blue-600
                   focus:ring-4 focus:ring-blue-100
                   focus:outline-none">

            <option selected disabled>Select Insurance Company</option>

            <option>Star Health Insurance</option>
            <option>HDFC ERGO Health Insurance</option>
            <option>ICICI Lombard Health Insurance</option>
            <option>Care Health Insurance</option>
            <option>Niva Bupa Health Insurance</option>

        </select>

        <!-- Custom Dropdown Arrow -->
        <span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none">
            expand_more
        </span>

    </div>

</div>
<!-- Advisor Details -->
<div class="mb-8">

    <h4 class="text-gray-900 font-medium mb-4 font-medium">
        Policy Advisor / Agent
    </h4>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

        <!-- Agent Name -->
        <div>

            <label class="block text-gray-600 mb-2">
                Name
            </label>

            <input
                type="text"
                placeholder="Enter Advisor Name"
                class="w-full border-b-2 border-gray-400 bg-transparent py-2 focus:outline-none focus:border-blue-600">

        </div>

        <!-- Mobile -->
        <div>

            <label class="block text-gray-600 mb-2">
                Mobile No.
            </label>

            <input
                type="tel"
                maxlength="10"
                placeholder="10 Digit Mobile Number"
                class="w-full border-b-2 border-gray-400 bg-transparent py-2 focus:outline-none focus:border-blue-600">

        </div>

    </div>

</div>

                <!-- Policy Number -->
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">
                        Policy No.
                    </label>

                    <input type="text" placeholder="123654789654123" class="w-full border-b-2 border-gray-400
                   bg-transparent py-2
                   focus:outline-none focus:border-blue-600">
                </div>
                <!-- Policy Period -->
                <div class="mb-6">

                    <label class="block text-gray-700 font-bold mb-4">
                        Policy Period
                    </label>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">

                        <!-- From -->
                        <div class="flex items-center gap-3">

                            <label class="font-semibold text-gray-600 whitespace-nowrap">
                                From :
                            </label>

                            <input type="date" class="flex-1 border-b-2 border-gray-400
                       bg-transparent py-2
                       focus:outline-none focus:border-blue-600">

                        </div>

                        <!-- To -->
                        <div class="flex items-center gap-3">

                            <label class="font-semibold text-gray-600 whitespace-nowrap">
                                To :
                            </label>

                            <input type="date" class="flex-1 border-b-2 border-gray-400
                       bg-transparent py-2
                       focus:outline-none focus:border-blue-600">

                        </div>

                    </div>

                </div>
                <!-- Product Plan -->
                <div class="mb-6">
                    <label class="block text-gray-700 font-bold mb-2">
                        Policy Product / Plan Name
                    </label>

                    <input type="text" placeholder="Family Health Shield Premium" class="w-full border-b-2 border-gray-400
                   bg-transparent py-2
                   focus:outline-none focus:border-blue-600">
                </div>

                <!-- Insured Members -->
                <div>

                    <div class="flex items-center justify-between mb-4">

                        <label class="text-gray-700 font-bold text-lg">
                            Name of Insured Family Members
                        </label>

                        <button type="button" onclick="addMemberField()"
                            class="bg-blue-600 text-white px-4 py-2 rounded-lg font-semibold hover:bg-blue-700 transition">

                            + Add

                        </button>

                    </div>

                    <div id="memberContainer">

                        <input type="text" name="member[]" placeholder="1. Name of Member" class="member-input w-full border-b-2 border-gray-400
                   bg-transparent py-2 mb-4
                   focus:outline-none focus:border-blue-600">

                    </div>

                </div>


                <!-- Heading -->
                <h2 class="text-2xl font-bold text-center text-blue-700 mb-4 mt-6">
                    Upload Insurance Documents
                </h2>

                <p class="text-center text-gray-600 text-lg mb-10">
                    Upload your insurance card, policy document,
                    claim papers or any supporting files.
                </p>

                <!-- Upload Area -->


                <label for="insuranceFile" class="border-4 border-dashed border-sky-400
                          rounded-3xl p-12 flex flex-col items-center
                          justify-center cursor-pointer
                          hover:bg-sky-50 transition-all mt-[70px]">

                    <div class="text-6xl mb-4">
                        📄
                    </div>

                    <p class="text-2xl font-bold text-sky-600">
                        Click to Upload Files
                    </p>

                    <p class="text-gray-500 mt-2 text-center">
                        PDF, Images, DOC, DOCX, XLS, XLSX, ZIP or any file format
                    </p>

                    <input type="file" id="insuranceFile" multiple class="hidden" accept="*/*">

                </label>

            </div>

            
            <!-- File Preview -->
            <div id="fileList" class="mt-8 space-y-4">
            </div>

            <!-- Buttons -->
            <div class="flex flex-col sm:flex-row gap-4 mt-10">

                <button class="flex-1 bg-gray-200 text-gray-700
               py-4 rounded-2xl font-bold text-lg
               hover:bg-gray-300 transition-all">

                    Cancel

                </button>

                <button class="flex-1 bg-green-600 text-white
               py-4 rounded-2xl font-bold text-lg
               hover:bg-green-700 transition-all">

                    Submit Documents

                </button>

            </div>
        </div>

    </div>

    <!-- Upload Success Popup -->
<div
    id="uploadPopup"
    class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">

    <div class="bg-white rounded-3xl shadow-xl p-8 w-[90%] max-w-md text-center">

        <div class="text-6xl mb-4">
            ✅
        </div>

        <h2 class="text-2xl font-bold text-green-700 mb-3">
            Documents Uploaded
        </h2>

        <p class="text-gray-600 mb-6">
            Your insurance documents have been uploaded successfully.
        </p>

        <button
            onclick="closePopup()"
            class="bg-blue-600 text-white px-8 py-3 rounded-xl font-semibold hover:bg-blue-700">

            OK

        </button>

    </div>

</div>

<script>

    // -------------------------
    // Add Family Member Fields
    // -------------------------

    function addMemberField() {

        const container = document.getElementById("memberContainer");

        const count =
            container.querySelectorAll(".member-input").length + 1;

        const input = document.createElement("input");

        input.type = "text";
        input.name = "member[]";
        input.placeholder = `${count}. Name of Member`;

        input.className =
            "member-input w-full border-b-2 border-gray-400 bg-transparent py-2 mb-4 focus:outline-none focus:border-blue-600";

        container.appendChild(input);

    }


    // -------------------------
    // File Upload Preview
    // -------------------------

    const fileInput = document.getElementById("insuranceFile");
    const fileList = document.getElementById("fileList");

    fileInput.addEventListener("change", function () {

        fileList.innerHTML = "";

        for (let file of this.files) {

            const div = document.createElement("div");

            div.className =
                "bg-blue-50 border border-blue-200 rounded-2xl p-4 flex justify-between items-center";

            div.innerHTML = `
                <div>
                    <p class="font-bold text-blue-700">${file.name}</p>

                    <p class="text-gray-500 text-sm">
                        ${(file.size / 1024 / 1024).toFixed(2)} MB
                    </p>
                </div>

                <span class="bg-green-100 text-green-700 px-4 py-2 rounded-full font-semibold">
                    Ready
                </span>
            `;

            fileList.appendChild(div);

        }

        // Show Success Popup
        // if (this.files.length > 0) {

        //     const popup = document.getElementById("uploadPopup");

        //     popup.classList.remove("hidden");
        //     popup.classList.add("flex");

        // }

    });


    // -------------------------
    // Close Popup
    // -------------------------

    function closePopup() {

        const popup = document.getElementById("uploadPopup");

        popup.classList.remove("flex");
        popup.classList.add("hidden");

    }

</script>

</body>

</html>
