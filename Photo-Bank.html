<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Bank</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body {
            background: #f8f9ff;
            font-family: Arial, Helvetica, sans-serif;
        }

        .photo-card img {
            width: 100%;
            height: 260px;
            object-fit: cover;
            border-radius: 12px;
            transition: .3s;
            box-shadow: 0 5px 15px rgba(0, 0, 0, .12);
        }

        .photo-card img:hover {
            transform: scale(1.04);
        }
    </style>
</head>

<body>

    <section class="max-w-7xl mx-auto py-16 px-8">

        <h1 class="text-5xl font-bold text-[#0B4DA2] mb-12">
            Photo Bank
        </h1>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">

            <!-- Photo 1 -->
            <div class="photo-card text-center">
                <img src="images/emmy_180711_07097.jpg" alt="Patient Care">
                <p class="mt-5 text-xl font-semibold">Patient Care</p>
            </div>

            <!-- Photo 2 -->
            <div class="photo-card text-center">
                <img src="images/hospital-emergency-room-stockcake.jpg" alt="Emergency Room">
                <p class="mt-5 text-xl font-semibold">Emergency Room</p>
            </div>

            <!-- Photo 3 -->
            <div class="photo-card text-center">
                <img src="images/images (9).jpg" alt="Hospital Ward">
                <p class="mt-5 text-xl font-semibold">Hospital Ward</p>
            </div>

            <!-- Photo 4 -->
            <div class="photo-card text-center">
                <img src="images/images (10).jpg" alt="Patient Room">
                <p class="mt-5 text-xl font-semibold">Patient Room</p>
            </div>

            <!-- Photo 5 -->
            <div class="photo-card text-center">
                <img src="images/images (11).jpg" alt="ICU">
                <p class="mt-5 text-xl font-semibold">ICU</p>
            </div>

            <!-- Photo 6 -->
            <div class="photo-card text-center">
                <img src="images/images (12).jpg" alt="Operation Theatre">
                <p class="mt-5 text-xl font-semibold">Operation Theatre</p>
            </div>

        </div>

    </section>

</body>

</html>
