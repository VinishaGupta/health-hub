<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Bank</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body{
            background:#f8f9ff;
            font-family:Arial, Helvetica, sans-serif;
            margin:0;
        }

        .photo-card img{
            width:100%;
            height:260px;
            object-fit:cover;
            border-radius:12px;
            cursor:pointer;
            transition:.3s;
            box-shadow:0 5px 15px rgba(0,0,0,.12);
        }

        .photo-card img:hover{
            transform:scale(1.04);
        }

        #imagePopup{
            position:fixed;
            inset:0;
            background:rgba(0,0,0,.85);
            display:none;
            justify-content:center;
            align-items:center;
            z-index:9999;
        }

        #imagePopup img{
            max-width:90%;
            max-height:90%;
            border-radius:12px;
            box-shadow:0 0 30px rgba(0,0,0,.5);
        }

        #closeBtn{
            position:absolute;
            top:20px;
            right:35px;
            color:white;
            font-size:55px;
            cursor:pointer;
            font-weight:bold;
            transition:.3s;
            user-select:none;
        }

        #closeBtn:hover{
            color:#ff4d4d;
        }
    </style>
</head>

<body>

<!-- ================= Hospital Header ================= -->

<section class="bg-white shadow-sm border-b">

    <div class="max-w-7xl mx-auto px-10 py-8 flex items-center gap-8">

        <!-- Logo -->
  <div class="max-w-7xl mx-auto  flex items-center gap-6">

    <div class="w-28 h-28 rounded-full border-4 border-sky-500 flex items-center justify-center text-xl font-bold text-[#0B4DA2]">

        Logo

    </div>

    <div>

        <h1 class="text-4xl font-bold text-[#0B4DA2]">
            Hospital's Name
        </h1>

        <p class="text-xl font-bold text-[#006878] mt-2">
            Location
        </p>

    </div>

</div>
        </div>

    </div>

</section>

<!-- ================= Photo Bank ================= -->

<section class="max-w-7xl mx-auto py-16 px-8">

<h1 class="text-3xl font-bold text-[#0B4DA2] mb-8">        Photo Bank
    </h1>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-12">

        <!-- Photo 1 -->
        <div class="photo-card text-center">
            <img src="images/emmy_180711_0097.jpg"
                 alt="Patient Care"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                Patient Care
            </p>
        </div>

        <!-- Photo 2 -->
        <div class="photo-card text-center">
            <img src="images/hospital-emergency-room-stockcake.jpg"
                 alt="Emergency Room"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                Emergency Room
            </p>
        </div>

        <!-- Photo 3 -->
        <div class="photo-card text-center">
            <img src="images/images (9).jpg"
                 alt="Hospital Ward"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                Hospital Ward
            </p>
        </div>

        <!-- Photo 4 -->
        <div class="photo-card text-center">
            <img src="images/images (10).jpg"
                 alt="Patient Room"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                Patient Room
            </p>
        </div>

        <!-- Photo 5 -->
        <div class="photo-card text-center">
            <img src="images/images (11).jpg"
                 alt="ICU"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                ICU
            </p>
        </div>

        <!-- Photo 6 -->
        <div class="photo-card text-center">
            <img src="images/images (12).jpg"
                 alt="Operation Theatre"
                 onclick="openImage(this.src)">
            <p class="mt-5 text-xl font-semibold">
                Operation Theatre
            </p>
        </div>

    </div>

</section>

<!-- ================= Image Popup ================= -->

<div id="imagePopup">

    <span id="closeBtn" onclick="closeImage()">&times;</span>

    <img id="popupImage">

</div>

<script>

function openImage(src){

    document.getElementById("popupImage").src = src;
    document.getElementById("imagePopup").style.display = "flex";

}

function closeImage(){

    document.getElementById("imagePopup").style.display = "none";

}

// Close when clicking outside image
document.getElementById("imagePopup").addEventListener("click",function(e){

    if(e.target.id==="imagePopup"){

        closeImage();

    }

});

// Close with ESC key
document.addEventListener("keydown",function(e){

    if(e.key==="Escape"){

        closeImage();

    }

});

</script>

</body>
</html>
